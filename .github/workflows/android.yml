name: Build Little Whale AR
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Load pinned tracking engine
        run: bash scripts/prepare.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle character renderer
        working-directory: viewer
        run: npm ci && npm run build
      - name: Compile ARM64 Android application
        run: bash upstream/gradlew --max-workers=3 :app:assembleRelease
      - name: Verify unsigned release candidate
        shell: bash
        run: |
          set -eu
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          bt="$ANDROID_HOME/build-tools/37.0.0"
          "$bt/zipalign" -c 4 "$apk"
          "$bt/aapt" dump badging "$apk" > /tmp/package-info
          grep -F "name='dev.littlewhale.ar'" /tmp/package-info
          grep -F 'android.permission.CAMERA' /tmp/package-info
          grep -F "native-code: 'arm64-v8a'" /tmp/package-info
          grep -F "launchable-activity: name='dev.littlewhale.ar.TableActivity'" /tmp/package-info
          unzip -Z1 "$apk" > /tmp/apk-files
          grep -E '^lib/arm64-v8a/.+\.so$' /tmp/apk-files
          grep -Fx assets/viewer/scene.bundle.js /tmp/apk-files
          grep -Fx assets/viewer/index.html /tmp/apk-files
          grep -F lib/arm64-v8a/libglb_renderer.so /tmp/apk-files
          grep -F lib/arm64-v8a/libMenthaAR_Engine.so /tmp/apk-files
          grep -Fx assets/hand_landmarker.task /tmp/apk-files
          grep -Fx lib/arm64-v8a/libmediapipe_tasks_vision_jni.so /tmp/apk-files
          character=$(find app/build/intermediates/javac -path '*/classes/dev/littlewhale/ar/CharacterView.class' -print -quit)
          test -f "$character"
          jar cf character-api.jar -C "${character%/dev/littlewhale/ar/CharacterView.class}" dev/littlewhale/ar/CharacterView.class
          cp "$apk" unsigned-candidate-0.15.0-arm64.apk
          sha256sum unsigned-candidate-0.15.0-arm64.apk
      - name: Collect tools for private SDK packaging
        run: |
          mkdir -p /tmp/easy-tools
          cp "$ANDROID_HOME"/platforms/android-35/android.jar /tmp/easy-tools/
          cp "$ANDROID_HOME"/build-tools/37.0.0/{lib/d8.jar,zipalign,aapt} /tmp/easy-tools/
          cp -a "$ANDROID_HOME"/build-tools/37.0.0/lib64 /tmp/easy-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: easyar-packaging-tools
          path: /tmp/easy-tools
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-candidate-0.15.0-arm64
          path: |
            unsigned-candidate-0.15.0-arm64.apk
            character-api.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-sdk-apksigner
          path: /usr/local/lib/android/sdk/build-tools/37.0.0/lib/apksigner.jar
          if-no-files-found: error
  reference-tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libopencv-calib3d-dev
      - run: bash verify/test-image.sh
  character-gestures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise blank taps, held animation and release in WebGL
        run: |
          set -eu
          mkdir -p /tmp/ar-gestures/motions
          cp app/src/main/assets/viewer/index.html /tmp/ar-gestures/
          curl -fsSL --retry 3 https://github.com/CF-612/YuChat/releases/download/v0.5.1-quest-test/Desktop-SmallBlueFish-Quest.apk -o /tmp/author.apk
          unzip -jp /tmp/author.apk assets/Motions/local-grab/grabbed.vrma >/tmp/ar-gestures/motions/grabbed.vrma
          unzip -jp /tmp/author.apk assets/Motions/local-locomotion/locomotion_walk.vrma >/tmp/ar-gestures/motions/locomotion_walk.vrma
          cd viewer
          npm ci
          cat scene.js ../verify/gesture-fixture.js | ./node_modules/.bin/esbuild --loader=js --bundle --outfile=/tmp/ar-gestures/scene.bundle.js
          cd ..
          npm install --prefix /tmp/ar-gestures --no-save playwright@1.56.1
          python3 -m http.server 18811 --directory /tmp/ar-gestures >/tmp/gesture-http.log 2>&1 &
          export CHROME_BIN=$(command -v google-chrome)
          NODE_PATH=/tmp/ar-gestures/node_modules node verify/gesture-test.cjs
