plugins { id 'com.android.application' }
android {
    namespace 'com.orb.slam2s' // The upstream camera shader loader imports this R class.
    compileSdk 37
    compileSdkMinor 2
    buildToolsVersion '37.0.0'
    ndkVersion '27.3.13750724'
    defaultConfig {
        applicationId 'dev.littlewhale.ar'
        minSdk 29
        targetSdk 35
        versionCode 26
        versionName '0.21.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    externalNativeBuild { cmake { path 'CMakeLists.txt'; version '3.22.1' } }
    sourceSets.main.java.srcDir layout.buildDirectory.dir('camera-src').get().asFile
    androidResources { noCompress += 'task' }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('palm-assets').get().asFile
    sourceSets.main.res.srcDir layout.buildDirectory.dir('camera-res').get().asFile
}
tasks.register('copyCameraSources', Sync) {
    from '../upstream/app/src/main/java'
    include 'com/orb/slam2s/camera/**',
            'com/orb/slam2s/graphics/AspectGLSurfaceView.java',
            'com/orb/slam2s/graphics/DisplayCorrection.java',
            'com/orb/slam2s/graphics/GLPassThroughRenderer.java',
            'com/orb/slam2s/graphics/GLPointCloudRenderer.java',
            'com/orb/slam2s/graphics/GLUtils.java'
    into layout.buildDirectory.dir('camera-src')
}
tasks.register('copyCameraShaders', Sync) {
    from '../upstream/app/src/main/res/raw'
    include '*shader*'
    into layout.buildDirectory.dir('camera-res/raw')
}
tasks.named('preBuild') { dependsOn 'copyCameraSources', 'copyCameraShaders' }
dependencies {
    implementation 'com.google.ar:core:1.53.0'
    implementation 'com.google.mediapipe:tasks-vision:0.10.32'
    implementation project(':MenthaAR-SDK')
    runtimeOnly project(':MenthaAR')
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.camera:camera-core:1.7.0'
    implementation 'androidx.camera:camera-camera2:1.7.0'
    implementation 'androidx.camera:camera-lifecycle:1.7.0'
}


// Provide the extracted official distribution and a package-bound license for full local builds.
if (project.hasProperty('easyarRoot')) {
    def root = file(project.property('easyarRoot'))
    def sdk = new File(root, 'variants/Community/Android/EasyAR.aar')
    def sample = new File(root, 'samples/Community/Android/HelloARMotionTracking/app/src/main/java')
    def license = file(project.property('easyarLicense'))
    def localInputs = layout.buildDirectory.dir('easyar-inputs').get().asFile
    tasks.register('prepareEasyAR', Sync) {
        from(sample) { include '**/BGRenderer.java'; into 'java' }
        from(license) { rename { 'easyar-license.txt' }; into 'assets' }
        into localInputs
    }
    tasks.named('preBuild') { dependsOn 'prepareEasyAR' }
    android.sourceSets.main.java.srcDirs 'src/easyar/java', new File(localInputs, 'java')
    android.sourceSets.main.assets.srcDir new File(localInputs, 'assets')
    dependencies.add('implementation', files(sdk))
}
