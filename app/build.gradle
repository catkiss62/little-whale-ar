plugins { id 'com.android.application' }
android {
    namespace 'com.orb.slam2s' // The upstream camera shader loader imports this R class.
    compileSdk 37
    compileSdkMinor 2
    buildToolsVersion '37.0.0'
    ndkVersion '27.3.13750724'
    defaultConfig {
        applicationId 'dev.littlewhale.ar'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    externalNativeBuild { cmake { path 'CMakeLists.txt'; version '3.22.1' } }
    sourceSets.main.java {
        srcDir '../upstream/app/src/main/java'
        include 'dev/littlewhale/ar/**', 'com/orb/slam2s/camera/**',
                'com/orb/slam2s/graphics/AspectGLSurfaceView.java',
                'com/orb/slam2s/graphics/DisplayCorrection.java',
                'com/orb/slam2s/graphics/GLPassThroughRenderer.java',
                'com/orb/slam2s/graphics/GLPointCloudRenderer.java',
                'com/orb/slam2s/graphics/GLUtils.java'
    }
    // Only shaders from the sample are used. Other resources belong to its original UI.
    sourceSets.main.res.srcDir layout.buildDirectory.dir('camera-res').get().asFile
}
tasks.register('copyCameraShaders', Copy) {
    from '../upstream/app/src/main/res/raw'
    include '*shader*'
    into layout.buildDirectory.dir('camera-res/raw')
}
tasks.named('preBuild') { dependsOn 'copyCameraShaders' }
dependencies {
    implementation project(':MenthaAR-SDK')
    runtimeOnly project(':MenthaAR')
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.camera:camera-core:1.7.0'
    implementation 'androidx.camera:camera-camera2:1.7.0'
    implementation 'androidx.camera:camera-lifecycle:1.7.0'
}
