<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;margin:0}
html,body,canvas{width:100%;height:100%;overflow:hidden;background:transparent;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block}
#area-panel,#pickup-tip{position:absolute;z-index:1;top:8px;left:50%;transform:translateX(-50%);width:max-content;max-width:96%;padding:6px 10px;border-radius:8px;background:#142b39ed;color:white;font:14px/1.5 sans-serif;text-align:center}
#palm-outline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#palm-outline[hidden]{display:none}
button{color:#b9f6ff;background:transparent;border:0;font:inherit;padding:5px 8px}
#coin-button{position:absolute;top:8px;right:8px;z-index:1;border-radius:8px;background:#142b39ed;font:14px sans-serif;padding:8px 12px}
#capture{position:absolute;top:8px;left:8px;z-index:2;background:#142b39ed;border-radius:8px;padding:1px 4px;font:14px sans-serif}
#capture button:disabled{opacity:.5}
</style></head><body>
<div id="capture" hidden><button>拍照</button><button>录像</button></div>
<div id="palm-outline" hidden><svg width="100%" height="100%" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><polygon fill="#69e0cb" fill-opacity=".13" stroke="#9af2df" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>
<button id="coin-button" hidden>放硬币</button>
<div id="pickup-tip" hidden style="pointer-events:none"></div>
<div id="area-panel" hidden><span id="area-tip"></span> <button id="area-cancel">取消</button><button id="area-clear">清除范围</button></div>
<script src="scene.bundle.js"></script></body></html>
