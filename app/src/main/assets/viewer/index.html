<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box;margin:0}
html,body,canvas{width:100%;height:100%;overflow:hidden;background:transparent;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block}
#area-panel,#pickup-tip{position:absolute;z-index:1;top:8px;left:50%;transform:translateX(-50%);width:max-content;max-width:96%;padding:6px 10px;border-radius:8px;background:#241f2aef;color:white;font:14px/1.5 sans-serif;text-align:center}
#palm-outline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#palm-outline[hidden]{display:none}
button{color:#dec7ff;background:transparent;border:0;font:inherit;padding:5px 8px}
#coin-button{position:absolute;top:8px;right:8px;z-index:1;border-radius:8px;background:#241f2aef;font:14px sans-serif;padding:8px 12px}
#speech{position:absolute;z-index:2;pointer-events:none;transform:translate(-50%,-100%);max-width:76%;width:max-content;padding:6px 11px;background:#f8f1fff5;color:#2a2134;border-radius:13px;font:600 15px/1.45 sans-serif;box-shadow:0 2px 7px #16273640}
#speech::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:#f8f1ff;transform:rotate(45deg)}
#voice{position:absolute;z-index:3;left:8px;top:8px;padding:7px 10px;border-radius:9px;background:#241f2aef;color:white;font:14px sans-serif}

#voice,#coin-button{min-height:40px;border-radius:20px;padding:8px 15px;color:#e4d2ff}
#voice[aria-pressed=true]{background:#4a365fed}#voice[aria-pressed=false]{color:#c9c3ce}
#area-panel:not([hidden]),#pickup-tip:not([hidden]){top:54px}
</style></head><body>
<div id="speech" hidden></div>
<button id="voice" aria-pressed="true">语音 · 开</button>
<div id="palm-outline" hidden><svg width="100%" height="100%" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><polygon fill="#b082ff" fill-opacity=".13" stroke="#dbc4ff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg></div>
<button id="coin-button" hidden>放硬币</button>
<div id="pickup-tip" hidden style="pointer-events:none"></div>
<div id="area-panel" hidden><span id="area-tip"></span> <button id="area-cancel">取消</button><button id="area-clear">清除范围</button></div>
<script src="scene.bundle.js"></script></body></html>
